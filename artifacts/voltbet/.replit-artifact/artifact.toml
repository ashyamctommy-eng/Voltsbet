kind = "web"
previewPath = "/"
title = "VoltBet"
description = "A sports betting web app with live fixtures, betslip management, account wallets, promotions, and administration tools for VoltBet operators."
version = "1.0.0"
id = "artifacts/voltbet"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18289

[services.development]
run = "pnpm --filter @workspace/voltbet run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/voltbet", "run", "build" ]
serve = "static"
publicDir = "artifacts/voltbet/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18289"
BASE_PATH = "/"
