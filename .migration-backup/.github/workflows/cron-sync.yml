name: cron-sync
on:
  schedule:
    - cron: "0 6 */3 * *"    # UTC — every 3rd day (free tier ~11 syncs/mo)
  workflow_dispatch: {}
jobs:
  hit:
    runs-on: ubuntu-latest
    steps:
      # -m 300: the throttled sync takes ~50s
      - run: curl -fsS -m 300 "https://${{ secrets.VOLTBET_APP_URL }}/api/cron/sync?secret=${{ secrets.VOLTBET_CRON_SECRET }}"
