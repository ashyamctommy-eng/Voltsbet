name: cron-schedule
on:
  schedule:
    - cron: "0 5 * * *"      # UTC — 7-day calendar refresh (0 quota)
  workflow_dispatch: {}
jobs:
  hit:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS -m 120 "https://${{ secrets.VOLTBET_APP_URL }}/api/cron/schedule?secret=${{ secrets.VOLTBET_CRON_SECRET }}"
