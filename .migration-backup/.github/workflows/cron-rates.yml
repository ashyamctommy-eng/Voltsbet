name: cron-rates

# Automated market-rate sync (fiat + crypto) — keep Currency.rate and
# settings cryptoRates fresh without manual admin entry.
# Requires repo secrets: CRON_SECRET + APP_URL (see README).
# Runs hourly; the route self-throttles to RATES_SYNC_THROTTLE_MINUTES.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  rates:
    runs-on: ubuntu-latest
    steps:
      - name: Sync market rates
        run: |
          curl -fsS -o /dev/null -w "HTTP %{http_code}\n" \
            "${{ secrets.APP_URL }}/api/cron/rates?secret=${{ secrets.CRON_SECRET }}"
