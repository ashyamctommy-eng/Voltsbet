name: cron-purge
on:
  schedule:
    - cron: "0 0 * * *"      # UTC — purge expired calendar rows
  workflow_dispatch: {}
jobs:
  hit:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS -m 120 "https://${{ secrets.VOLTBET_APP_URL }}/api/cron/purge?secret=${{ secrets.VOLTBET_CRON_SECRET }}"
